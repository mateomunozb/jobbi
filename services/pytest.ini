[pytest]
testpaths = tests
# on_event ya se usaba en todo el backend; migrarlo a lifespan es otro cambio.
filterwarnings = ignore::DeprecationWarning
# Cobertura y reportes en cada corrida; el umbral mínimo lo impone el pipeline
# con --cov-fail-under para no frenar a quien corre una sola prueba en local.
addopts =
    --cov
    --cov-config=.coveragerc
    --cov-report=term
    --cov-report=xml:reports/coverage.xml
    --cov-report=html:reports/htmlcov
    --junitxml=reports/junit.xml
