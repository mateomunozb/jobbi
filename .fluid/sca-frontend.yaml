# Fluid Attacks SCA · dependencias npm del frontend
# Lo usa el pipeline del componente (fluidattacks/sca-action).
language: ES
# El build se rompe ante hallazgos de severidad alta o crítica (>= high).
strict: true
strictness_threshold: high
output:
  file_path: reports/fluid-sca-frontend.sarif
  format: SARIF
sca:
  include:
    - frontend/package.json
    - frontend/pnpm-lock.yaml
  exclude:
    - frontend/node_modules
