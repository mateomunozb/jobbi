# Fluid Attacks SCA · dependencias Python del backend
# Lo usa el pipeline del componente (fluidattacks/sca-action).
language: ES
# El build se rompe ante hallazgos de severidad alta o crítica (>= high).
strict: true
strictness_threshold: high
output:
  file_path: reports/fluid-sca-backend.sarif
  format: SARIF
sca:
  include:
    - services/requirements.txt
    - services/requirements-dev.txt
  exclude:
    - services/.venv
