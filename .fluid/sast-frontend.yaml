# Fluid Attacks SAST · código del frontend (frontend/)
# Lo usa el pipeline del componente (fluidattacks/sast-action).
language: ES
# El build se rompe ante hallazgos de severidad alta o crítica (>= high).
strict: true
strictness_threshold: high
output:
  file_path: reports/fluid-sast-frontend.sarif
  format: SARIF
sast:
  include:
    - frontend
  exclude:
    - frontend/node_modules
    - frontend/.next
