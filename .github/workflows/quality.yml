# ─────────────────────────────────────────────────────────────────────────────
# Calidad transversal: SonarCloud sobre todo el repositorio.
#
# Sonar analiza el proyecto completo (no por componente), así que corre en
# cada CI/CD sin importar qué cambió. Genera su propia cobertura del backend
# para no depender de que el pipeline del backend se haya ejecutado.
# ─────────────────────────────────────────────────────────────────────────────
name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/requirements-dev.txt
      - name: Cobertura y reporte de Ruff del backend
        working-directory: services
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
          ruff check . --output-format=json --output-file=reports/ruff.json --exit-zero
      - name: SonarCloud Scan (quality gate)
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
