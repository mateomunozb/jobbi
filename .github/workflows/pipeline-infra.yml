# ─────────────────────────────────────────────────────────────────────────────
# Pipeline de la INFRAESTRUCTURA (infra/, ci/): validación de la IaC.
#
#   terraform fmt + validate (shared, base, app-backend, app-frontend)
#   · docker compose config · Fluid SAST sobre Terraform y el compose
#
# Se ejecuta solo cuando cambian infra/ o ci/. La aplicación de la IaC la hace
# el job deploy-infra de cd.yml.
# ─────────────────────────────────────────────────────────────────────────────
name: Pipeline infra

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

env:
  TF_VERSION: "1.17.1"

jobs:
  iac-validate:
    name: infra · iac-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform fmt + validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          for raiz in shared base app-backend app-frontend; do
            echo "::group::terraform validate infra/$raiz"
            terraform -chdir="$raiz" init -backend=false -input=false
            terraform -chdir="$raiz" validate
            echo "::endgroup::"
          done
      - name: Docker Compose de integración (sintaxis)
        run: docker compose -f ci/docker-compose.ci.yml config --quiet

  security-sast:
    name: infra · security-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: mkdir -p reports
      - name: Fluid Attacks SAST (Terraform + compose)
        id: scan
        uses: fluidattacks/sast-action@bff64d57fdf98653f41f55922c1b0b472dd6a954 # 1.3.0
        with:
          scan_config_path: .fluid/sast-iac.yaml
          scanner_mode: ${{ github.event_name == 'pull_request' && 'diff' || 'full' }}
      - name: Subir SARIF a GitHub Security
        if: always() && steps.scan.outputs.sarif_file != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif_file }}
          category: fluid-sast-iac
