# SonarCloud: calidad, code smells, duplicación y cobertura (job "sonarcloud").
sonar.projectKey=mateomunozb_jobbi
sonar.organization=mateomunozb
sonar.projectName=JOBBI

sonar.sources=services,frontend/app,frontend/components,frontend/lib
sonar.tests=services/tests,tests
sonar.exclusions=services/tests/**,services/.venv/**,services/escalador_bd/**,frontend/node_modules/**,frontend/.next/**,frontend/components/ui/**
sonar.test.inclusions=services/tests/**,tests/**

sonar.python.version=3.11
# El frontend no tiene pruebas unitarias propias (lo cubren E2E e integración):
# sin esta exclusión, cualquier cambio de UI reprobaría la cobertura de código nuevo.
sonar.coverage.exclusions=frontend/**,tests/**,ci/**,infra/**
sonar.python.coverage.reportPaths=services/reports/coverage.xml
sonar.python.xunit.reportPath=services/reports/junit.xml
sonar.python.ruff.reportPaths=services/reports/ruff.json

# El job falla si no se cumple el Quality Gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
